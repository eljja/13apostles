<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>🧬 13 Apostles Dashboard — WebAssembly in Browser</title>
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css"
    />
    <style>
      /* Custom loader and theme overrides */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07071a;
        color: #e2e2f0;
        font-family: 'Inter', sans-serif;
      }
      
      /* Elegantly style the Stlite initial boot loader */
      #stlite-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(160deg, #07071a 0%, #0d1117 50%, #0a0f2a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(99, 102, 241, 0.1);
        border-radius: 50%;
        border-top-color: #6366f1;
        animation: spin 1s ease-in-out infinite;
      }
      
      .loader-text {
        margin-top: 24px;
        font-size: 1.1em;
        font-weight: 600;
        background: linear-gradient(135deg, #6366f1, #a78bfa, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
      }
      
      .loader-subtext {
        margin-top: 8px;
        font-size: 0.8em;
        color: rgba(160, 160, 220, 0.5);
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <!-- Premium WebAssembly Boot Loader -->
    <div id="stlite-loader">
      <div class="spinner"></div>
      <div class="loader-text">🧬 Spawning 13 Apostles in WebAssembly</div>
      <div class="loader-subtext">Initializing Python in Browser Sandbox (no backend required)...</div>
    </div>

    <!-- Container for Streamlit Mount -->
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      // Hide bootloader when Stlite finishes mounting the app
      const observer = new MutationObserver((mutations, obs) => {
        const appContainer = document.querySelector(".stApp");
        if (appContainer) {
          const loader = document.getElementById("stlite-loader");
          if (loader) {
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 500);
          }
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      const buster = new Date().getTime();
      stlite.mount({
        requirements: [], // Zero third-party requirements (Only standard library + Streamlit core)!
        entrypoint: "app.py",
        files: {
          "app.py": {
            url: `./app.py?v=${buster}`
          },
          "tree_parser.py": {
            url: `./tree_parser.py?v=${buster}`
          },
          "evolution.py": {
            url: `./evolution.py?v=${buster}`
          },
          "llm_client.py": {
            url: `./llm_client.py?v=${buster}`
          },
          "detailed_decision_analysis.json": {
            url: `./detailed_decision_analysis.json?v=${buster}`
          },
          "clustering_analysis.json": {
            url: `./clustering_analysis.json?v=${buster}`
          },
          "comprehensive_similarity_analysis.json": {
            url: `./comprehensive_similarity_analysis.json?v=${buster}`
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
