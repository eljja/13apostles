    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.css"
    />
    <style>
      /* Custom loader and theme overrides */
      html, body {
        margin: 0;
        padding: 0;
        background-color: #07071a;
        color: #e2e2f0;
        font-family: 'Inter', sans-serif;
      }
      
      /* Elegantly style the Stlite initial boot loader */
      #stlite-loader {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        background: linear-gradient(160deg, #07071a 0%, #0d1117 50%, #0a0f2a 100%);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        z-index: 9999;
        transition: opacity 0.5s ease;
      }
      
      .spinner {
        width: 60px;
        height: 60px;
        border: 4px solid rgba(99, 102, 241, 0.1);
        border-radius: 50%;
        border-top-color: #6366f1;
        animation: spin 1s ease-in-out infinite;
      }
      
      .loader-text {
        margin-top: 24px;
        font-size: 1.1em;
        font-weight: 600;
        background: linear-gradient(135deg, #6366f1, #a78bfa, #ec4899);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        letter-spacing: 0.05em;
      }
      
      .loader-subtext {
        margin-top: 8px;
        font-size: 0.8em;
        color: rgba(160, 160, 220, 0.5);
      }
      
      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Premium Glassmorphism Floating Dock */
      .floating-dock {
        position: fixed;
        top: 20px;
        right: 24px;
        display: flex;
        align-items: center;
        gap: 12px;
        z-index: 9999;
        background: rgba(13, 17, 23, 0.75);
        backdrop-filter: blur(16px);
        -webkit-backdrop-filter: blur(16px);
        border: 1px solid rgba(255, 255, 255, 0.08);
        border-radius: 30px;
        padding: 6px 14px;
        box-shadow: 0 12px 32px 0 rgba(0, 0, 0, 0.4);
        transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      }
      
      .floating-dock:hover {
        border-color: rgba(99, 102, 241, 0.4);
        box-shadow: 0 12px 32px 0 rgba(99, 102, 241, 0.18);
        transform: translateY(-2px);
      }
      
      .dock-btn {
        display: flex;
        align-items: center;
        gap: 8px;
        text-decoration: none;
        font-size: 0.82rem;
        font-weight: 600;
        padding: 6px 14px;
        border-radius: 20px;
        transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
        letter-spacing: 0.03em;
        user-select: none;
      }
      
      .github-btn {
        color: #ffffff;
        background: rgba(255, 255, 255, 0.05);
        border: 1px solid rgba(255, 255, 255, 0.08);
      }
      
      .github-btn:hover {
        background: rgba(255, 255, 255, 0.15);
        border-color: rgba(255, 255, 255, 0.25);
      }
      
      .paper-btn {
        color: #a5b4fc;
        background: rgba(99, 102, 241, 0.1);
        border: 1px solid rgba(99, 102, 241, 0.18);
      }
      
      .paper-btn:hover {
        color: #ffffff;
        background: rgba(99, 102, 241, 0.25);
        border-color: rgba(99, 102, 241, 0.45);
        box-shadow: 0 0 12px rgba(99, 102, 241, 0.25);
      }

      /* Responsive styling for mobile devices */
      @media (max-width: 768px) {
        .floating-dock {
          top: auto;
          bottom: 24px;
          right: 50%;
          transform: translateX(50%);
          padding: 6px 10px;
          gap: 8px;
          box-shadow: 0 8px 24px 0 rgba(0, 0, 0, 0.5);
        }
        .floating-dock:hover {
          transform: translateX(50%) translateY(-2px);
        }
        .dock-btn {
          font-size: 0.75rem;
          padding: 5px 10px;
        }
      }
    </style>
  </head>
  <body>
    <!-- Premium Glassmorphism Floating Dock for GitHub Pages redirection -->
    <div class="floating-dock">
      <a href="https://github.com/eljja/13apostles" target="_blank" class="dock-btn github-btn" title="View Source Code on GitHub">

        <span>GitHub</span>
      </a>
      <a href="https://github.com/eljja/13apostles/blob/main/scientific_analysis.md" target="_blank" class="dock-btn paper-btn en-btn" title="Read Scientific Paper (English)">
        <svg height="14" width="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

        <svg height="14" width="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:inline-block; vertical-align:middle;"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><polyline points="14 2 14 8 20 8"></polyline><line x1="16" y1="13" x2="8" y2="13"></line><line x1="16" y1="17" x2="8" y2="17"></line><polyline points="10 9 9 9 8 9"></polyline></svg>

    <!-- Premium WebAssembly Boot Loader -->
    <div id="stlite-loader">
      <div class="spinner"></div>
      <div class="loader-text">🧬 Spawning 13 Apostles in WebAssembly</div>
      <div class="loader-subtext">Initializing Python in Browser Sandbox (no backend required)...</div>
    </div>

    <!-- Container for Streamlit Mount -->
    <div id="root"></div>

    <script src="https://cdn.jsdelivr.net/npm/@stlite/mountable@0.58.0/build/stlite.js"></script>
    <script>
      // Hide bootloader when Stlite finishes mounting the app
      const observer = new MutationObserver((mutations, obs) => {
        const appContainer = document.querySelector(".stApp");
        if (appContainer) {
          const loader = document.getElementById("stlite-loader");
          if (loader) {
            loader.style.opacity = 0;
            setTimeout(() => loader.remove(), 500);
          }
          obs.disconnect();
        }
      });
      observer.observe(document.body, { childList: true, subtree: true });

      const buster = new Date().getTime();
      const baseUrl = window.location.href.split('?')[0].split('#')[0].replace(/\/?$/, '/');
      stlite.mount({
        requirements: ["toml"],
        entrypoint: "app.py",
        files: {
          ".streamlit/config.toml": `[theme]\nbase="dark"\nprimaryColor="#6366f1"\nbackgroundColor="#0d1117"\nsecondaryBackgroundColor="#1e1e3a"\ntextColor="#e2e2f0"\n`,
          "base_url_config.py": `BASE_URL = "${baseUrl}"\n`,
          "app.py": {
            url: `./app.py?v=${buster}`
          },
          "tree_parser.py": {
            url: `./tree_parser.py?v=${buster}`
          },
          "evolution.py": {
            url: `./evolution.py?v=${buster}`
          },
          "llm_client.py": {
            url: `./llm_client.py?v=${buster}`
          },
          "detailed_decision_analysis.json": {
            url: `./detailed_decision_analysis.json?v=${buster}`
          },
          "organism_basenames.json": {
            url: `./organism_basenames.json?v=${buster}`
          },
          "clustering_analysis.json": {
            url: `./clustering_analysis.json?v=${buster}`
          },
          "comprehensive_similarity_analysis.json": {
            url: `./comprehensive_similarity_analysis.json?v=${buster}`
          }
        }
      }, document.getElementById("root"));
    </script>
  </body>
</html>
